HTML
<div class="container mt-4">
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">HU-S1-05: Registrar Nuevo Docente</h4>
    </div>
    <div class="card-body">
      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombres</label>
            <input type="text" class="form-control" name="nombres" placeholder="Nombres del docente">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" name="apellidos" placeholder="Apellidos del docente">
          </div>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Documento de Identidad (CI)</label>
            <input type="text" class="form-control" name="documento_identidad" placeholder="Ej. 1234567">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Código Docente</label>
            <input type="text" class="form-control" name="codigo" placeholder="Ej. DOC-101">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" name="correo" placeholder="correo@institucion.com">
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Especialidad</label>
            <input type="text" class="form-control" name="especialidad" placeholder="Ej. Desarrollo de Software">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" name="estado">
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-success">Guardar en Base de Datos</button>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">Docentes Registrados (Control de Personal)</h5>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-hover mb-0">
        <thead>
          <tr>
            <th>Código</th>
            <th>Docente</th>
            <th>Documento (CI)</th>
            <th>Correo</th>
            <th>Especialidad</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>DOC-001</td>
            <td>Ana María Justiniano</td>
            <td>8765432</td>
            <td>anamaria@u.edu.bo</td>
            <td>Base de Datos</td>
            <td><span class="badge bg-success">Activo</span></td>
            <td>
              <button class="btn btn-sm btn-warning me-1">Editar</button>
              <button class="btn btn-sm btn-danger">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
